name: Run Java

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java
        run: javac Bai3.java

      - name: Run Java
        run: java Bai3
